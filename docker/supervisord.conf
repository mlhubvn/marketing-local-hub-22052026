[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
priority=10
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=/bin/sh -c 'while [ "${APP_INSTALLED:-false}" != "true" ]; do sleep 30; done; while [ "${RUN_QUEUE_WORKER:-true}" != "true" ]; do sleep 60; done; exec php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout="${QUEUE_WORKER_TIMEOUT:-80}" --max-time=3600 --no-interaction'
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/bin/sh -c 'while [ "${APP_INSTALLED:-false}" != "true" ]; do sleep 30; done; exec php /var/www/html/artisan schedule:work'
directory=/var/www/html
user=www-data
priority=30
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
