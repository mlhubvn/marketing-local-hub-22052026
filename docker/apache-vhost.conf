<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/public

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /public/ /var/www/html/public/

    AliasMatch "^/resources/themes/([^/]+)/([^/]+)/assets/(.*)$" "/var/www/html/resources/themes/$1/$2/assets/$3"
    AliasMatch "^/resources/themes/([^/]+)/([^/]+)/(preview\.(?:png|svg|jpg|jpeg|webp))$" "/var/www/html/resources/themes/$1/$2/$3"
    Alias /resources/themes/shared/css/ /var/www/html/resources/themes/shared/css/
    Alias /resources/themes/shared/js/ /var/www/html/resources/themes/shared/js/
    Alias /resources/themes/shared/plugins/ /var/www/html/resources/themes/shared/plugins/
    AliasMatch "^/modules/([^/]+)/Public/(.*)$" "/var/www/html/modules/$1/Public/$2"

    <DirectoryMatch "^/var/www/html/resources/themes/[^/]+/[^/]+/assets">
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <DirectoryMatch "^/var/www/html/resources/themes/[^/]+/[^/]+$">
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)^(?!preview\.(png|svg|jpg|jpeg|webp)$).+$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    <Directory /var/www/html/resources/themes/shared>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "^/var/www/html/modules/[^/]+/Public">
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
